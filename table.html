<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        color: #343a40;
      }
      table {
        width: 800px;
        margin-left: 400px;
        margin-top: 100px;
        border: 5px black solid;
        justify-content: center;
      }
      thead {
        background-color: beige;
      }
      tbody {
        text-align: center;
      }
      td,
      th {
        padding: 12px;
      }
      tbody tr:nth-child(even) {
        background-color: aliceblue;
      }
      tbody tr:nth-child(odd) {
        background-color: rgb(173, 184, 194);
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Chair</th>
          <th>The Laid Back</th>
          <th>The worker bee</th>
          <th>The chair 4/2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Width</th>
          <td>80 cm</td>
          <td>40 cm</td>
          <td>600 cm</td>
        </tr>
        <tr>
          <th>Height</th>
          <td>80 cm</td>
          <td>40 cm</td>
          <td>600 cm</td>
        </tr>
        <tr>
          <th>Depth</th>
          <td>80 cm</td>
          <td>40 cm</td>
          <td>600 cm</td>
        </tr>
        <tr>
          <th>Weight</th>
          <td>80 cm</td>
          <td>40 cm</td>
          <td>600 cm</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
