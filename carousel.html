<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        color: #343a40;
      }
      .Carousel {
        background-color: beige;
        width: 900px;
        height: 300px;
        margin: auto;
        margin-top: 60px;
        border-radius: 40px;
        display: flex;
        gap: 20px;
        /* position: absolute; */
      }
      img {
        height: 350px;
        margin-left: 80px;
        margin-top: -25px;
        border-radius: 40px;
      }
      .text {
        display: grid;
        /* flex-direction: column; */
        padding: 30px;
        /* justify-content: center; */
      }
      .content {
        align-self: center;
        letter-spacing: 0.1rem;
      }
      .author {
        align-self: flex-end;
      }
      svg {
        height: 24px;
        width: 24px;
        margin-top: 3px;
      }
      .arrow1 {
        position: relative;
        left: -10px;
        background-color: rgb(131, 129, 129);
        border-radius: 50%;
        margin-top: 130px;
        height: 30px;
        width: 60px;
        justify-content: center;
      }
      .arrow2 {
        position: relative;
        right: -10px;
        background-color: rgb(131, 129, 129);
        border-radius: 50%;
        margin-top: 130px;
        height: 30px;
        width: 60px;
        justify-content: center;
      }
      .circles {
        margin-left: 850px;
        display: flex;
        margin-top: 50px;
        gap: 30px;
      }
    </style>
  </head>
  <body>
    <div class="Carousel">
      <div class="arrow1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </div>
      <div class="pic">
        <img src="maria.jpg" />
      </div>
      <div class="text">
        <div class="content">
          "Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt
          voluptatibus in doloribus molestiae ad ab cupiditate iure asperiores
          delectus animi repellat neque fugit, nulla ex itaque totam temporibus
          libero quas."
        </div>
        <div class="author">
          <p>Twisha Patel</p>
          <p>Intern</p>
        </div>
      </div>
      <div class="arrow2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </div>
    </div>
    <div class="circles">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
          clip-rule="evenodd"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
          clip-rule="evenodd"
        />
      </svg>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
          clip-rule="evenodd"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </body>
</html>
