<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        color: #343a40;
      }
      svg {
        height: 24px;
        width: 24px;
        margin-top: 3px;
      }
      .button {
        border-radius: 50%;
      }
      .Pagination {
        margin-left: 400px;
        margin-top: 0250px;
        display: flex;
        gap: 40px;
      }
      .link {
        margin-top: 10px;
        text-decoration: none;
        display: flex;
        height: 36px;
        width: 36px;
        align-items: center;
        justify-content: center;
      }
      .dots {
        margin-top: 8px;
      }
      .link:hover {
        background-color: grey;

        align-items: center;
        border-radius: 50%;
      }
      .link:active {
        background-color: grey;

        align-items: center;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="Pagination">
      <button class="button">
        <div class="arrow1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5 8.25 12l7.5-7.5"
            />
          </svg>
        </div>
      </button>
      <a href="#" class="link">1</a> <a href="#" class="link">2</a>
      <a href="#" class="link">3</a> <a href="#" class="link">4</a>
      <a href="#" class="link">5</a> <a href="#" class="link">6</a>
      <a href="#" class="link">7</a> <a href="#" class="link">8</a>
      <a href="#" class="link">9</a>
      <span class="dots">...</span>
      <a href="#" class="link">23</a>
      <button class="button">
        <div class="arrow2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m8.25 4.5 7.5 7.5-7.5 7.5"
            />
          </svg>
        </div>
      </button>
    </div>
  </body>
</html>
